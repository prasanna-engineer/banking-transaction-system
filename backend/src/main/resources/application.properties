spring.application.name=banking-system
server.port=8081

# Database (XAMPP MariaDB). Override with env vars DB_URL / DB_USERNAME / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/banking_system_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Schema is owned by src/main/resources/schema.sql (like a Laravel migration), not generated by Hibernate.
# XAMPP's MariaDB 10.4 is too old for Hibernate's auto-DDL, which silently skipped foreign keys.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
