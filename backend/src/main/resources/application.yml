spring:
  application:
    name: banking
  config:
    # Loads KEY=VALUE pairs from a git-ignored .env file (repo root or backend/) if present.
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/banking_mgmt_db}
    username: ${SPRING_DATASOURCE_USERNAME:banking_app}
    # No default: the app should fail fast if the password is not configured.
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    # db/seed holds fictional demo data for local development only (tests leave it out).
    locations: classpath:db/migration,classpath:db/seed

app:
  jwt:
    # HMAC-SHA256 signing key, at least 32 bytes. No default: never ship a guessable secret.
    secret: ${JWT_SECRET}
    issuer: banking-demo
    access-token-ttl: 30m
  transfer:
    # Largest single demo transfer. Larger amounts are rejected with AMOUNT_LIMIT_EXCEEDED.
    max-amount: 1000000.00
  cors:
    # Comma-separated list of browser origins allowed to call the API (the Vite dev server by default).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

server:
  # 8080 is taken by XAMPP Apache on this machine. Override with the SERVER_PORT env var.
  port: ${SERVER_PORT:8081}
