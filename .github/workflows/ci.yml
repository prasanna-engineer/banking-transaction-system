# Runs on every push and pull request: all backend tests against a real MariaDB, plus frontend lint, tests and build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (Java 21 + MariaDB)
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: banking_mgmt_test_db
          MARIADB_USER: banking_app
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run tests
        # Throwaway credentials for the disposable CI database only. The test profile supplies its own JWT key.
        env:
          SPRING_DATASOURCE_PASSWORD: ci-test-password
          TEST_DATASOURCE_URL: jdbc:mariadb://127.0.0.1:3306/banking_mgmt_test_db
        run: ./mvnw -B clean test

  frontend:
    name: Frontend lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
