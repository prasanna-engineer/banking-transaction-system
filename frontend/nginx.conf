server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Note: nginx ignores server-level add_header lines inside any location that has its own add_header,
    # so the security headers are repeated in each location below.

    # Hashed build files never change, so browsers may cache them for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Single-page app: unknown paths like /accounts/1 are handled by React Router, so serve index.html.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }
}
